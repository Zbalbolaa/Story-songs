<style>
  :root { --bg:#0c0a1d; --ink:#f4f1ff; --muted:#a09bc9; --glass:rgba(255,255,255,.06); --glass2:rgba(255,255,255,.11);
    --line:rgba(255,255,255,.13); --violet:#7c5cff; --pink:#ff3d9a; --amber:#ffb347;
    --grad:linear-gradient(135deg,#7c5cff 0%,#ff3d9a 62%,#ff8a4c 100%); color-scheme:dark; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  body { margin:0; min-height:100vh; color:var(--ink); font:16px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    background-color:var(--bg);
    background-image:radial-gradient(60% 40% at 12% 0%,rgba(124,92,255,.38),transparent 62%),
      radial-gradient(50% 35% at 95% 8%,rgba(255,61,154,.26),transparent 62%),
      radial-gradient(60% 40% at 50% 100%,rgba(255,138,76,.14),transparent 62%);
    background-attachment:fixed; }
  main { max-width:520px; margin:0 auto; padding:34px 18px 64px; }
  h1 { font:800 clamp(3.2rem,15vw,4.6rem)/.95 "Bricolage Grotesque",system-ui,sans-serif; letter-spacing:-.045em; margin:0 0 10px;
    background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; width:fit-content; }
  .tag { font:700 1.15rem "Bricolage Grotesque",system-ui,sans-serif; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 22px; font-size:.95rem; }
  .load { margin:0 0 16px; }
  #status { font-size:.88rem; color:var(--muted); margin:0 0 7px; }
  .track { height:5px; background:var(--glass2); border-radius:3px; overflow:hidden; }
  #bar { height:100%; width:0; background:var(--grad); transition:width .2s; }

  .pick { position:relative; overflow:hidden; display:grid; place-items:center; gap:4px; padding:34px 16px 28px; text-align:center;
    border-radius:30px; background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    cursor:pointer; transition:transform .15s,border-color .2s,background .2s; }
  .pick:hover:not(.off) { transform:translateY(-2px); border-color:rgba(255,255,255,.28); }
  .pick:active:not(.off) { transform:scale(.985); }
  .pick.drag { border-color:var(--pink); background:var(--glass2); }
  .pick.off { cursor:not-allowed; }
  .pick:focus-within { outline:3px solid var(--amber); outline-offset:3px; }
  .pick input { position:absolute; opacity:0; width:1px; height:1px; }
  .orb { position:relative; width:104px; height:104px; border-radius:50%; background:var(--grad); display:grid; place-items:center;
    box-shadow:0 10px 40px rgba(255,61,154,.45); margin-bottom:10px; transition:filter .3s; }
  .orb svg { width:44px; height:44px; fill:none; stroke:#fff; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .orb::before,.orb::after { content:""; position:absolute; inset:0; border-radius:50%; border:2px solid rgba(255,61,154,.55); animation:ring 2.8s ease-out infinite; }
  .orb::after { animation-delay:1.4s; }
  @keyframes ring { from { transform:scale(1); opacity:.85; } to { transform:scale(1.9); opacity:0; } }
  .pick.off .orb { filter:grayscale(.75) brightness(.65); box-shadow:none; }
  .pick.off .orb::before,.pick.off .orb::after { animation:none; opacity:0; }
  .pick strong { font:700 1.15rem "Bricolage Grotesque",system-ui,sans-serif; }
  .pick small { color:var(--muted); }

  .frame { position:relative; width:min(62%,230px); aspect-ratio:9/16; margin:24px auto 0; border-radius:30px; overflow:hidden;
    box-shadow:0 0 0 2px rgba(255,255,255,.2),0 26px 60px rgba(124,92,255,.38),0 0 70px rgba(255,61,154,.2); }
  .frame img { width:100%; height:100%; object-fit:cover; display:block; }
  .badge { position:absolute; left:10px; right:10px; bottom:12px; padding:8px 12px; border-radius:999px; text-align:center;
    background:rgba(12,10,29,.7); border:1px solid rgba(255,255,255,.18); color:#fff; font-weight:700; font-size:.9rem; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  .row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:16px; }
  .again { margin:0; }

  button, a.lnk { font:700 .82rem/1 "Plus Jakarta Sans",system-ui,sans-serif; min-height:38px; padding:0 15px; border-radius:999px;
    border:1px solid var(--line); background:var(--glass); color:var(--ink); cursor:pointer; text-decoration:none; white-space:nowrap;
    display:inline-flex; align-items:center; justify-content:center;
    transition:transform .12s,background .15s,border-color .15s,box-shadow .15s,filter .15s; }
  button:hover, a.lnk:hover { background:var(--glass2); border-color:rgba(255,255,255,.3); transform:translateY(-1px); }
  button:active, a.lnk:active { transform:scale(.95); }
  button:focus-visible, a.lnk:focus-visible { outline:3px solid var(--amber); outline-offset:2px; }
  button.copy { background:var(--grad); border-color:transparent; color:#fff; box-shadow:0 6px 18px rgba(255,61,154,.38); }

  a.lnk.yt:hover { background:rgba(255,90,90,.14); border-color:rgba(255,90,90,.6); }
  a.lnk.spo { color:#4ade80; border-color:rgba(34,197,94,.38); }
  a.lnk.spo:hover { background:rgba(34,197,94,.14); border-color:rgba(34,197,94,.6); }

  .tabs { display:flex; gap:9px; margin:24px 0 12px; }
  .tab { flex:1; min-width:0; min-height:0; padding:12px 6px; border-radius:20px; display:block; text-align:center; font-weight:600; line-height:1.3; }
  .tab b { display:block; font-size:1.45rem; line-height:1.25; }

  .filters { display:flex; gap:7px; margin:0 0 10px; flex-wrap:wrap; }
  .chip { color:var(--muted); font-weight:600; min-height:34px; }
  .chip:hover { color:var(--ink); }
  .chip[aria-pressed="true"] { background:var(--grad); color:#fff; border-color:transparent; box-shadow:0 5px 16px rgba(255,61,154,.32); }

  ul { list-style:none; margin:0; padding:0; background:var(--glass); border:1px solid var(--line); border-radius:24px; overflow:hidden;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  li { display:grid; grid-template-columns:1fr auto auto auto; align-items:center; gap:8px; padding:13px 14px; border-top:1px solid var(--line); transition:background .15s; }
  li:first-child { border-top:0; }
  li:hover { background:rgba(255,255,255,.04); }
  .song { display:flex; align-items:center; gap:8px; min-width:0; }
  .song > div { min-width:0; flex:1; }
  .song b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:700; }
  .song span { color:var(--muted); font-size:.85rem; }
  .langs { display:flex; gap:6px; justify-content:flex-end; margin:-12px 0 10px; }
  .langs .chip { min-height:30px; padding:0 11px; font-size:.75rem; }
  .cap { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:14px; padding:14px; border:1px solid var(--line); border-radius:20px; background:var(--glass); }
  .cap span { flex:1 1 100%; font-weight:600; }
  .heart { flex:none; width:36px; min-height:36px; padding:0; font-size:1.15rem; }
  .heart.on { color:var(--pink); border-color:var(--pink); }
  .chip.done { background:linear-gradient(135deg,#22c55e,#16a34a); border-color:transparent; color:#fff; }
  .upd { position:fixed; left:50%; transform:translateX(-50%); bottom:16px; z-index:10; display:flex; gap:10px; align-items:center; padding:8px 8px 8px 16px;

  .empty { display:block; padding:16px; color:var(--muted); }
  @media (max-width:480px) {

  .more { margin-top:16px; }
  .more summary { cursor:pointer; color:var(--muted); font-weight:600; font-size:.9rem; padding:8px 0; }
  .more .filters { margin-top:8px; }
  .genres { margin-top:34px; }

  .genres p { color:var(--muted); font-size:.88rem; margin:0 0 12px; }
  .genres ul { margin-top:12px; }
  .hint { color:var(--muted); font-size:.85rem; margin-top:26px; }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none !important; animation:none !important; } }
</style>

<body>
<main>
  <div class="langs" id="langs" role="group" aria-label="Language">
    <button class="chip" data-l="en" type="button">EN</button><button class="chip" data-l="fr" type="button">FR</button><button class="chip" data-l="ar" type="button">AR</button>
  </div>
  <h1>Stazam</h1>
  <p class="tag" data-i="tag"></p>
  <p class="sub" data-i="sub"></p>

  <button class="chip" id="install" type="button" hidden style="margin:0 0 16px" data-i="install"></button>

  <div class="load" id="load">
    <p id="status" role="status">Starting the model…</p>
    <div class="track"><div id="bar"></div></div>
  </div>

  <label class="pick off" id="pick">
    <input id="file" type="file" accept="image/*" disabled>
    <span class="orb"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
    <strong data-i="pick"></strong>
    <small data-i="drop"></small>
  </label>

  <section id="out" hidden>
    <div class="frame"><img id="preview" alt="Your photo"><div class="badge" id="badge"></div></div>
    <div class="row"><button class="again" id="again" type="button" data-i="again"></button><button class="again" id="card" type="button" data-i="card"></button></div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="filters" id="filters">
      <button class="chip" data-f="all" aria-pressed="true" type="button" data-i="fAll"></button>
      <button class="chip" data-f="local" aria-pressed="false" type="button" data-i="fLocal"></button>
      <button class="chip" data-f="intl" aria-pressed="false" type="button" data-i="fIntl"></button>
    </div>
    <ul id="list"></ul>
    <div class="row"><button class="chip" id="shuffle" type="button" data-i="shuffle"></button></div>
    <div class="cap"><span id="captext"></span><button class="chip" id="capcopy" type="button" data-i="capcopy"></button><button class="chip" id="capnext" type="button" data-i="another"></button></div>
    <details class="more"><summary data-i="notright"></summary><div class="filters" id="mchips"></div></details>
  </section>

  <section class="genres" id="favsec" hidden>
    <h2 data-i="favs"></h2>
    <ul id="flist"></ul>
  </section>

  <section class="genres" id="genres" hidden>
    <h2 data-i="browse"></h2>
    <p data-i="browsep"></p>
    <div class="filters" id="gchips"></div>
    <ul id="glist" hidden></ul>
  </section>

  <p class="hint" data-i="hint"></p>
  <div class="row"><button class="chip" id="share" type="button" data-i="share"></button></div>
  <p class="hint"><span data-i="privacy"></span> <a href="https://github.com/Zbalbolaa/Story-songs" target="_blank" rel="noopener" style="color:inherit">GitHub</a></p>
  <div class="upd" id="upd" hidden><span data-i="newv"></span><button class="copy" id="reload" type="button" data-i="reload"></button></div>
</main>

const KEY = {};
for (const [k, arr] of Object.entries(MOODS)) for (const l of arr) KEY[l] = k;
const classify = url => classifier(url, LABELS, { hypothesis_template: 'a photo of {}' });

// ask the browser not to evict the cached model
navigator.storage?.persist?.().catch(() => {});
if (navigator.serviceWorker) {
  const had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had) $('upd').hidden = false; });
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
let installEvt;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('install').hidden = false; });
$('install').addEventListener('click', async () => { installEvt.prompt(); await installEvt.userChoice; $('install').hidden = true; });

// aggregate download progress across all model files
const prog = {};
function onProgress(p) {
  if (p.status === 'progress' && p.total) {
    prog[p.file] = { l: p.loaded, t: p.total };
    let L = 0, T = 0; for (const f of Object.values(prog)) { L += f.l; T += f.t; }
    const pc = Math.round(L / T * 100);
    bar.style.width = pc + '%';
    status.textContent = `${t('dl')} ${pc}%`;
  }
}

// shrink big phone photos: much faster than feeding 12MP images
async function shrink(file, max = 448) {
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(bmp.width * s)); c.height = Math.max(1, Math.round(bmp.height * s));
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  bmp.close?.();
  return new Promise(r => c.toBlob(b => r(URL.createObjectURL(b)), 'image/jpeg', 0.9));
}

const GN = { pop:'Pop', rock:'Rock', hiphop:'Hip-Hop', rnb:'R&B', country:'Country', edm:'EDM', jazz:'Jazz', latin:'Latin', reggae:'Reggae', trap:'Trap', metal:'Metal', classical:'Classical', blues:'Blues', afrobeats:'Afrobeats' };

try {
  [songs, genres, classifier] = await Promise.all([
    fetch('songs.json').then(r => r.json()),

async function handle(file) {
  if (!file || !file.type.startsWith('image/')) return;
  status.textContent = t('reading'); $('load').hidden = false; bar.style.width = '100%';
  try {
    lastFile = file;
    const url = await shrink(file);
    $('preview').src = url;
    const out = await classify(url);
    const sums = {}, L = store('stazam-learn', {});
    for (const o of out) sums[KEY[o.label]] = (sums[KEY[o.label]] || 0) + o.score;
    for (const k in sums) sums[k] += Math.min(.1, .02 * (L[k] || 0));   // moods you picked before get a small boost
    top = Object.entries(sums).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([key, score]) => ({ key, score: Math.min(score, 1) }));
    sel = 0; filt = 'all'; manual = null; seed = 0; cap = 0;
    $('out').hidden = false; pick.hidden = true;
    render();
    $('load').hidden = true;
  } catch (e) {

fileInput.addEventListener('change', () => handle(fileInput.files[0]));

$('reload').onclick = () => location.reload();
$('share').onclick = async () => {
  const d = { title: 'Stazam', text: t('tag'), url: location.href.split('#')[0] };
  try { if (navigator.share) await navigator.share(d); else await copyText(d.url, $('share'), 'share'); } catch {}
};

function applyLang() {
  if (!T[lang]) lang = 'en';
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i]').forEach(el => el.textContent = t(el.dataset.i));
  document.querySelectorAll('.langs .chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.l === lang));
  document.querySelectorAll('#mchips .chip').forEach(c => c.textContent = `${META[c.dataset.k][1]} ${mn(c.dataset.k)}`);
  if (top.length && !$('out').hidden) render();
  renderFavs();
}

function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let x = Math.imul(a ^ a >>> 15, 1 | a); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }

function showCap() { const a = CAPS[curKey()] || []; $('captext').textContent = a.length ? a[cap % a.length] : ''; }

function render() {
  const key = curKey(), score = manual ? null : top[sel].score;
  $('badge').textContent = `${META[key][1]} ${mn(key)}` + (score == null ? '' : ` · ${Math.round(score * 100)}%`);
  $('tabs').innerHTML = '';
  top.forEach((x, i) => {
    const b = document.createElement('button');
    b.className = 'tab'; b.type = 'button'; b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', i === sel && !manual);
    b.innerHTML = `<b>${META[x.key][1]}</b>${mn(x.key)} ${Math.round(x.score * 100)}%`;
    b.onclick = () => { manual = null; sel = i; seed = 0; cap = 0; render(); };
    $('tabs').append(b);
  });
  document.querySelectorAll('#filters .chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.f === filt));
  document.querySelectorAll('#mchips .chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.k === manual));
  const list = $('list'); list.innerHTML = '';
  const all = (songs[key] || []).filter(s => filt === 'all' || (filt === 'local' ? s.t : !s.t));
  shown = (seed ? shuffled(all, seed) : all).slice(0, 6);
  if (!shown.length) list.innerHTML = '<li class="empty">—</li>';
  for (const s of shown) list.append(songRow(s));
  showCap();
}

async function copyText(text, btn, label) {
  try { await navigator.clipboard.writeText(text); }
  catch { const a = document.createElement('textarea'); a.value = text; document.body.append(a); a.select(); document.execCommand('copy'); a.remove(); }
  btn.textContent = t('copied'); btn.classList.add('done');
  setTimeout(() => { btn.textContent = t(label); btn.classList.remove('done'); }, 1500);
}

function songRow(s) {
  const q = encodeURIComponent(`${s.title} ${s.artist}`);
  const li = document.createElement('li');
  li.innerHTML = `<div class="song"><div><b></b><span></span></div><button class="heart" type="button" aria-label="Favorite">♡</button></div>
    <button class="copy" type="button"></button>
    <a class="lnk yt" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${q}">YouTube</a>
    <a class="lnk spo" target="_blank" rel="noopener" href="https://open.spotify.com/search/${q}">Spotify</a>`;
  li.querySelector('b').textContent = s.title;
  li.querySelector('span').textContent = s.artist;
  const cp = li.querySelector('.copy'); cp.textContent = t('copy');
  cp.onclick = () => copyText(`${s.title} ${s.artist}`, cp, 'copy');
  const hb = li.querySelector('.heart');
  const isFav = () => favs().some(f => fid(f) === fid(s));
  const paint = () => { hb.classList.toggle('on', isFav()); hb.textContent = isFav() ? '♥' : '♡'; };
  paint();
  hb.onclick = () => { save('stazam-fav', isFav() ? favs().filter(f => fid(f) !== fid(s)) : [...favs(), s]); paint(); renderFavs(); };
  return li;
}

function renderFavs() {
  const a = favs(), ul = $('flist');
  ul.innerHTML = ''; $('favsec').hidden = !a.length;
  for (const s of a) ul.append(songRow(s));
}

function initGenres() {
  const box = $('gchips'); let open = null;
  for (const g of Object.keys(GN)) {

    c.className = 'chip'; c.type = 'button'; c.textContent = GN[g]; c.setAttribute('aria-pressed', 'false');
    c.onclick = () => {
      open = open === g ? null : g;
      box.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x.textContent === GN[open]));
      const ul = $('glist'); ul.innerHTML = ''; ul.hidden = !open;
      if (open) for (const s of genres[open] || []) ul.append(songRow(s));
    };
    box.append(c);
  }
  for (const k of Object.keys(META)) {
    const c = document.createElement('button');
    c.className = 'chip'; c.type = 'button'; c.dataset.k = k; c.textContent = `${META[k][1]} ${mn(k)}`; c.setAttribute('aria-pressed', 'false');
    c.onclick = () => { manual = k; seed = 0; cap = 0; bump(k); render(); };
    $('mchips').append(c);
  }
  $('genres').hidden = false;
}

// shareable 1080x1920 image for Stories
function rr(x, a, b, w, h, r) { x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath(); }
